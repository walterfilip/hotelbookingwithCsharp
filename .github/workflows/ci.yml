name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore hotelbooking.Tests/hotelbooking.Tests.csproj

      - name: Test
        run: dotnet test hotelbooking.Tests/hotelbooking.Tests.csproj --no-restore
